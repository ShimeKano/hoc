<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bài 9</title>

<style>

table,th,td{
border:1px solid black;
border-collapse:collapse;
padding:5px;
}

</style>

</head>

<body>

<h1>Cell that spans two columns</h1>

<p>
To make a cell span more than one column,
use the colspan attribute.
</p>

<table style="width:400px">

<tr>
<th colspan="2">Name</th>
<th>Age</th>
</tr>

<tr>
<td>Jill</td>
<td>Smith</td>
<td>43</td>
</tr>

<tr>
<td>Eve</td>
<td>Jackson</td>
<td>57</td>
</tr>

</table>

</body>
</html>
