<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bài 10</title>

<style>

table,th,td{
border:1px solid black;
border-collapse:collapse;
padding:5px;
}

</style>

</head>

<body>

<h1>Cell that spans two rows</h1>

<p>
To make a cell span more than one row,
use the rowspan attribute.
</p>

<table style="width:350px">

<tr>
<th rowspan="2">Phone</th>
<td>555-1234</td>
</tr>

<tr>
<td>555-8745</td>
</tr>

</table>

</body>
</html>
