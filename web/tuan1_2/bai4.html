<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bài 4</title>

<style>
table, th, td{
    border:2px solid blue;
    border-collapse:collapse;
}

th{
    background-color:yellow;
}

td,th{
    padding:5px;
}
</style>

</head>

<body>

<h1>Table With Invisible Borders</h1>

<p>
Style the table with white borders and a background color of the cells
to make the impression of invisible borders.
</p>

<table width="500">

<tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
</tr>

<tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
</tr>

<tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
</tr>

<tr>
    <td>John</td>
    <td>Doe</td>
    <td>80</td>
</tr>

</table>

</body>
</html>
