<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 2</title>

    <style>
        body {
            background-color: #ffffcc;
            text-align: center;
        }

        h1 {
            background-color: #ffccff;
            color: #ff3399;
        }

        .kho1 {
            color: blue;
            font-style: italic;
        }

        .kho2 {
            color: brown;
            font-style: italic;
        }

        .kho3 {
            color: green;
            font-style: italic;
        }

        hr {
            width: 40%;
        }
    </style>
</head>

<body>

    <h1>MẸ!</h1>

    <div class="kho1">
        Mẹ là cả một trời thương<br>
        Mẹ là một thiên đường trần gian<br>
        Công ơn cha mẹ tựa biển trời
    </div>

    <hr>

    <div class="kho2">
        Làm sao báo hiếu hỡi người ơi?<br>
        Nếu chưa báo hiếu đừng bất hiếu<br>
        Bất hiếu làm ta khổ muôn đời
    </div>

    <hr>

    <div class="kho3">
        Một đời vốn tiếng mẹ trao<br>
        Mẹ cho tất cả mẹ nào giữ riêng<br>
        Mẹ hiền như một bà tiên<br>
        Mẹ theo con suốt hành trình con đi
    </div>

</body>
</html>
